name: Program 19 Autograding

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check required files
        run: |
          test -f src/App.js
          test -f src/App.test.js
          test -f src/components/Navigation.js
          test -f src/pages/Home.js
          test -f src/pages/About.js
          test -f src/index.css
          test -f public/index.html

      - name: Install dependencies
        run: npm install

      - name: Check React Router components
        run: |
          grep -q "BrowserRouter" src/App.js
          grep -q "Routes" src/App.js
          grep -q "Route" src/App.js
          grep -q "Link" src/components/Navigation.js

      - name: Check student image
        run: |
          grep -qi "student.jpg" src/pages/Home.js

      - name: Run test cases
        run: CI=true npm test -- --watchAll=false

      - name: Build React application
        run: npm run build
